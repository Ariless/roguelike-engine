name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 03:17 UTC nightly. Off the hour on purpose: scheduled jobs cluster at :00
    # across GitHub and get queued behind everyone else's cron.
    - cron: '17 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Fast barrier ───────────────────────────────────────────────────────────
  # Everything that fits inside a minute. If this fails, the other jobs are never spent.
  verify:
    name: Types, unit, BDD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit, property, statistical, replay
        run: npm test

      - name: BDD scenarios
        run: npm run test:bdd

  # ─── Simulation ─────────────────────────────────────────────────────────────
  # Two checks with deliberately different strictness.
  #
  # Determinism is blocking. simulate exits with code 1 on corrupted timelines or
  # a hash divergence: the same seed has to produce a byte-identical log, and a
  # violation of that is a defect, no discussion.
  #
  # Balance is reported rather than blocking while BUG-14 is open. Three classes
  # out of four are currently outside their corridor, and half of that skew comes
  # from two enemies not performing the actions the specification declares. A gate
  # on balance before those mechanics ship would keep the build permanently red
  # and teach people to ignore the colour.
  #
  # Once the enemy mechanics land in the engine, replace the step with
  #     npm run simulate 16000 -- --gate
  # and the corridors will block merges the same way the unit tests do.
  simulation:
    name: Monte Carlo and stability
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Monte Carlo — determinism blocking, balance reported
        run: npm run simulate 16000 | tee simulation.txt

      - name: Metric stability — cross-batch spread and convergence
        run: npm run stability 4000 4 | tee stability.txt

      - name: Publish reports to job summary
        if: always()
        run: |
          {
            echo '## Monte Carlo'
            echo '```'
            cat simulation.txt
            echo '```'
            echo '## Metric stability'
            echo '```'
            cat stability.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── UI ─────────────────────────────────────────────────────────────────────
  ui:
    name: Playwright
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: UI and visual regression
        run: npm run test:ui

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # ─── Test quality ───────────────────────────────────────────────────────────
  # Deliberately NOT run on every push. A full Stryker pass over 13 files takes
  # around 38 minutes; feedback that arrives after the author has moved on is not
  # feedback, and a job nobody waits for stops being a gate and becomes noise. That
  # is the same argument this workflow already applies to the balance corridors.
  #
  # What it costs to move it off the push path: a score can now drift for up to a
  # day before anyone sees it. That is acceptable because the score moves slowly —
  # it changes when tests are added or weakened, not with every commit — while the
  # 38-minute wait was paid on every single push.
  #
  # The threshold lives in stryker.config.json (thresholds.break), not here: it is
  # part of the project contract rather than a build setting. Stryker returns code 1
  # by itself when the score drops below it — CI must not duplicate that number.
  mutation:
    name: Mutation score
    runs-on: ubuntu-latest
    # Nightly, or on demand. Not on push, not on pull_request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Stryker
        run: npm run test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14

      - name: Publish score to job summary
        if: always()
        run: |
          if [ -f reports/mutation/mutation.json ]; then
            node -e "
              const d = require('./reports/mutation/mutation.json');
              const c = {};
              for (const f of Object.values(d.files)) {
                for (const m of f.mutants) c[m.status] = (c[m.status] || 0) + 1;
              }
              const killed = (c.Killed||0) + (c.Timeout||0);
              const valid = killed + (c.Survived||0) + (c.NoCoverage||0);
              console.log('## Mutation score');
              console.log('');
              console.log('**' + (killed/valid*100).toFixed(2) + '%** — ' + killed + ' of ' + valid + ' mutants killed');
              console.log('');
              console.log('| Status | Count |');
              console.log('|---|---:|');
              for (const [k, v] of Object.entries(c)) console.log('| ' + k + ' | ' + v + ' |');
            " >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Stryker produced no report — see the job log.' >> "$GITHUB_STEP_SUMMARY"
          fi
