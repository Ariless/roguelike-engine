name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Быстрый барьер ─────────────────────────────────────────────────────────
  # Всё, что укладывается в минуту. Падает здесь — остальные джобы не тратятся.
  verify:
    name: Types, unit, BDD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit, property, statistical, replay
        run: npm test

      - name: BDD scenarios
        run: npm run test:bdd

  # ─── Симуляция ──────────────────────────────────────────────────────────────
  # Две проверки с разной строгостью, и это осознанно.
  #
  # Детерминизм — блокирующий. simulate завершается с кодом 1, если есть
  # испорченные таймлайны или расхождение хешей: одинаковый seed обязан давать
  # байт-в-байт одинаковый лог, и нарушение этого дефект без обсуждения.
  #
  # Баланс — отчётный, пока не закрыт BUG-14. Три класса из четырёх сейчас вне
  # коридора, и половина перекоса идёт от того, что двое врагов не выполняют
  # заявленных в спецификации действий. Гейт на балансе до реализации механик
  # держал бы сборку красной постоянно и приучил бы игнорировать красный цвет.
  #
  # Когда механики врагов появятся в движке: заменить шаг на
  #     npm run simulate 16000 -- --gate
  # и коридоры начнут блокировать мерж так же, как unit-тесты.
  simulation:
    name: Monte Carlo and stability
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Monte Carlo — determinism blocking, balance reported
        run: npm run simulate 16000 | tee simulation.txt

      - name: Metric stability — cross-batch spread and convergence
        run: npm run stability 4000 4 | tee stability.txt

      - name: Publish reports to job summary
        if: always()
        run: |
          {
            echo '## Monte Carlo'
            echo '```'
            cat simulation.txt
            echo '```'
            echo '## Metric stability'
            echo '```'
            cat stability.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── UI ─────────────────────────────────────────────────────────────────────
  ui:
    name: Playwright
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: UI and visual regression
        run: npm run test:ui

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # ─── Качество тестов ────────────────────────────────────────────────────────
  # Порог живёт в stryker.config.json (thresholds.break), а не здесь: он часть
  # контракта проекта, а не настройка сборки. Stryker сам вернёт код 1, если
  # score опустится ниже — CI не должен дублировать это число.
  mutation:
    name: Mutation score
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Stryker
        run: npm run test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
